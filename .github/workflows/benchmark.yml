---
name: Benchmark

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Download previous benchmark data
        uses: actions/cache/restore@v6
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Build binary
        run: |
          ./autogen.sh
          ./configure
          make -j4 all

      - name: Run benchmark
        run: |
          sudo ./apps/n3n-edge test fakebench | tee benchmark.csv
          ./scripts/benchmark2graphdata.py <benchmark.csv >benchmark.json

      - name: Store benchmark result (no token required)
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          external-data-json-path: ./cache/benchmark-data.json
          # Workflow will fail when an alert happens
          fail-on-alert: true

      - name: Store benchmark result (read-write token required)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          external-data-json-path: ./cache/benchmark-data.json
          # Workflow will fail when an alert happens
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          summary-always: true

      - name: Show the benchmark-data
        run: |
          jq < ./cache/benchmark-data.json

      - name: Always save benchmark data
        uses: actions/cache/save@v6
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
